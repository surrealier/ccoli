name: Docker Compose Tests

on:
  pull_request:
  push:
    branches: [ main, 'codex/**', 'feature/**' ]
  workflow_dispatch:

jobs:
  docker-compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Keep the local and CI entry point identical; the script captures
        # each Compose pipeline exit status and preserves its logs.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker availability on runner
        run: |
          docker --version
          docker compose version

      - name: Run Docker quality gates
        run: bash scripts/run_docker_tests.sh

      - name: Upload Docker test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-test-logs
          path: |
            artifacts/test-logs/*.log

      - name: Cleanup compose resources
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down --remove-orphans
