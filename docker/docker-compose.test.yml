services:
  server-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    working_dir: /app
    command: >-
      pytest server/tests
    environment:
      - PYTHONPATH=/app/server

  # `profiles` keeps these out of a bare `up`. Without it, `up
  # --abort-on-container-exit --exit-code-from server-test` starts every service and
  # the fastest one to finish tears down the pytest run before it reports.
  # Launch them explicitly with `docker compose ... run --rm <service>`.
  client-sim:
    profiles: ["manual"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    working_dir: /app
    command: python server/tests/client_sim_smoke.py
    environment:
      - PYTHONPATH=/app/server

  firmware-build:
    profiles: ["manual"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.firmware
    # Image CMD compiles every supported display/servo pin combination.

  dashboard-test:
    profiles: ["manual"]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../server/web/static/dashboard.js:/app/dashboard.js:ro
      - ../server/web/static/device_setup.js:/app/device_setup.js:ro
      - ../server/tests/dashboard_setup_smoke.cjs:/app/dashboard_setup_smoke.cjs:ro
      - ../server/tests/dashboard_auth_smoke.cjs:/app/dashboard_auth_smoke.cjs:ro
    command: ["sh", "-c", "node dashboard_auth_smoke.cjs && node dashboard_setup_smoke.cjs"]
