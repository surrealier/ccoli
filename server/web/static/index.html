<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccoli dashboard</title>
<link rel="icon" type="image/svg+xml" href="/brand-assets/ccoli.svg?v=20261008-icon2">
<link rel="stylesheet" href="/dashboard.css">
<script defer src="/dashboard.js"></script>
</head>
<body>
  <div class="top-metrics-bar" id="top-metrics-bar">
    <div class="metrics-bar-left">
      <img src="/brand-assets/ccoli.svg?v=20261008-icon2" alt="ccoli" class="bar-logo">
      <span class="bar-brand">ccoli</span>
      <span class="status-pill live-pill bar-status">
        <span class="dot" id="ws-dot"></span>
        <span id="ws-label"></span>
      </span>
    </div>
    <div class="metrics-bar-items">
      <span class="bar-metric" id="bar-stt"><span class="bar-metric-label">STT</span> <span class="bar-metric-value">—</span></span>
      <span class="bar-metric" id="bar-llm"><span class="bar-metric-label">LLM</span> <span class="bar-metric-value">—</span></span>
      <span class="bar-metric" id="bar-connection"><span class="bar-metric-label">Link</span> <span class="bar-metric-value">—</span></span>
      <span class="bar-metric" id="bar-mode"><span class="bar-metric-label">Mode</span> <span class="bar-metric-value">—</span></span>
    </div>
    <div class="metrics-bar-right">
      <label class="locale-field-inline">
        <select id="locale-select">
          <option value="en" data-i18n="locale.options.en"></option>
          <option value="ko" data-i18n="locale.options.ko"></option>
          <option value="ja" data-i18n="locale.options.ja"></option>
          <option value="zh" data-i18n="locale.options.zh"></option>
        </select>
      </label>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-toggle-icon" id="theme-icon">🌙</span>
      </button>
      <button class="btn ghost small" id="connect-ws" type="button" data-i18n="top.reconnect"></button>
      <button class="btn primary small" id="refresh-all" type="button" data-i18n="top.refresh"></button>
    </div>
  </div>

  <div class="page-shell">
    <aside class="sidebar surface">
      <div class="brand-lockup">
        <p class="kicker" data-i18n="brand.kicker"></p>
        <h1 class="title-clamp" data-i18n="brand.title"></h1>
        <p class="body-copy" data-i18n="brand.body"></p>
      </div>

      <nav class="nav" id="nav">
        <button class="active" data-tab="overview" type="button">
          <span class="nav-icon" aria-hidden="true">📊</span>
          <strong class="nav-label" data-i18n="nav.overview.label"></strong>
          <span class="nav-meta body-copy" data-i18n="nav.overview.body"></span>
        </button>
        <button data-tab="diagnostics" type="button">
          <span class="nav-icon" aria-hidden="true">🔧</span>
          <strong class="nav-label" data-i18n="nav.diagnostics.label"></strong>
          <span class="nav-meta body-copy" data-i18n="nav.diagnostics.body"></span>
        </button>
        <button data-tab="memory" type="button">
          <span class="nav-icon" aria-hidden="true">🧠</span>
          <strong class="nav-label" data-i18n="nav.memory.label"></strong>
          <span class="nav-meta body-copy" data-i18n="nav.memory.body"></span>
        </button>
        <button data-tab="conversation" type="button">
          <span class="nav-icon" aria-hidden="true">💬</span>
          <strong class="nav-label" data-i18n="nav.conversation.label"></strong>
          <span class="nav-meta body-copy" data-i18n="nav.conversation.body"></span>
        </button>
        <button data-tab="schedules" type="button">
          <span class="nav-icon" aria-hidden="true">📅</span>
          <strong class="nav-label" data-i18n="nav.schedules.label"></strong>
          <span class="nav-meta body-copy" data-i18n="nav.schedules.body"></span>
        </button>
        <button data-tab="chat" type="button">
          <span class="nav-icon" aria-hidden="true">✨</span>
          <strong class="nav-label" data-i18n="nav.chat.label"></strong>
          <span class="nav-meta body-copy" data-i18n="nav.chat.body"></span>
        </button>
        <button data-tab="logs" type="button">
          <span class="nav-icon" aria-hidden="true">📋</span>
          <strong class="nav-label" data-i18n="nav.logs.label"></strong>
          <span class="nav-meta body-copy" data-i18n="nav.logs.body"></span>
        </button>
      </nav>

      <section class="status-stack">
        <div class="chip-wrap">
          <span class="status-pill" id="mode-chip"></span>
          <span class="status-pill" id="emotion-chip"></span>
          <span class="status-pill" id="conversation-chip"></span>
        </div>
        <div class="body-copy" id="sidebar-summary"></div>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar surface">
        <div class="topbar-copy">
          <h2 class="title-clamp" id="topbar-tab-title" data-i18n="top.title"></h2>
          <p class="body-copy" id="topbar-tab-body" data-i18n="top.body"></p>
        </div>
      </header>

      <section class="tab active" id="tab-overview">
        <article class="hero surface">
          <div class="hero-copy">
            <div class="headline-lockup">
              <p class="kicker" data-i18n="overview.heroKicker"></p>
              <h3 class="title-clamp hero-title" id="hero-headline"></h3>
              <p class="body-copy" id="hero-description"></p>
            </div>
            <div class="action-wrap">
              <button class="btn secondary" data-tab-target="chat" type="button" data-i18n="overview.actions.chat"></button>
              <button class="btn ghost" data-tab-target="memory" data-memory-file="Soul.md" type="button" data-i18n="overview.actions.memory"></button>
            </div>
          </div>
          <div class="hero-figure">
            <div class="hero-note body-copy" id="hero-note"></div>
            <img src="/brand-assets/ccoli.svg?v=20261008-icon2" alt="ccoli voice agent symbol" id="hero-mascot">
          </div>
        </article>

        <div class="metric-grid">
          <article class="metric-card surface">
            <p class="metric-label" data-i18n="overview.metrics.mode"></p>
            <div class="metric-value" id="metric-mode"></div>
          </article>
          <article class="metric-card surface">
            <p class="metric-label" data-i18n="overview.metrics.emotion"></p>
            <div class="metric-value" id="metric-emotion"></div>
          </article>
          <article class="metric-card surface">
            <p class="metric-label" data-i18n="overview.metrics.conversation"></p>
            <div class="metric-value" id="metric-conversation"></div>
          </article>
          <article class="metric-card surface">
            <p class="metric-label" data-i18n="overview.metrics.connection"></p>
            <div class="metric-value" id="metric-connection"></div>
          </article>
        </div>

        <div class="panel-grid triple">
          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="overview.schedules.title"></h3>
                <p class="body-copy" data-i18n="overview.schedules.body"></p>
              </div>
              <button class="btn ghost small" data-tab-target="schedules" type="button" data-i18n="overview.schedules.action"></button>
            </div>
            <div class="data-list" id="overview-schedules"></div>
          </article>

          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="overview.conversation.title"></h3>
                <p class="body-copy" data-i18n="overview.conversation.body"></p>
              </div>
              <button class="btn ghost small" data-tab-target="conversation" type="button" data-i18n="overview.conversation.action"></button>
            </div>
            <div class="data-list" id="overview-conversation"></div>
          </article>

          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="overview.logs.title"></h3>
                <p class="body-copy" data-i18n="overview.logs.body"></p>
              </div>
              <button class="btn ghost small" data-tab-target="logs" type="button" data-i18n="overview.logs.action"></button>
            </div>
            <div class="data-list" id="overview-logs"></div>
          </article>
        </div>
      </section>

      <section class="tab" id="tab-diagnostics">
        <div class="section-card surface">
          <div class="section-head">
            <div>
              <p class="kicker" data-i18n="diagnostics.kicker"></p>
              <h3 class="title-clamp" data-i18n="diagnostics.title"></h3>
              <p class="body-copy" data-i18n="diagnostics.body"></p>
            </div>
            <button class="btn secondary" id="diagnostics-refresh" type="button" data-i18n="diagnostics.refresh"></button>
          </div>
        </div>

        <div class="panel-grid quad" id="runtime-summary-cards"></div>

        <div class="panel-grid dual">
          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="diagnostics.stt.title"></h3>
                <p class="body-copy" data-i18n="diagnostics.stt.body"></p>
              </div>
              <button class="btn ghost small" id="stt-check" type="button" data-i18n="diagnostics.check"></button>
            </div>
            <dl class="detail-list" id="stt-summary-list"></dl>
            <form class="editor-grid" id="stt-settings-form">
              <label class="field">
                <span class="field-label" data-i18n="diagnostics.stt.device"></span>
                <select id="stt-device">
                  <option value="cpu" data-i18n="diagnostics.options.deviceCpu"></option>
                  <option value="cuda" data-i18n="diagnostics.options.deviceCuda"></option>
                </select>
              </label>
              <label class="field">
                <span class="field-label" data-i18n="diagnostics.stt.modelSize"></span>
                <select id="stt-model-size">
                  <option value="tiny">tiny</option>
                  <option value="base">base</option>
                  <option value="small">small</option>
                  <option value="medium">medium</option>
                  <option value="large">large</option>
                </select>
              </label>
              <div class="action-wrap">
                <button class="btn primary" type="submit" data-i18n="diagnostics.save"></button>
              </div>
            </form>
          </article>

          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="diagnostics.connection.title"></h3>
                <p class="body-copy" data-i18n="diagnostics.connection.body"></p>
              </div>
              <button class="btn ghost small" id="connection-check" type="button" data-i18n="diagnostics.check"></button>
            </div>
            <dl class="detail-list" id="connection-summary-list"></dl>
            <form class="editor-grid" id="connection-settings-form">
              <label class="field">
                <span class="field-label" data-i18n="diagnostics.connection.mode"></span>
                <select id="connection-mode">
                  <option value="auto" data-i18n="diagnostics.options.modeAuto"></option>
                  <option value="wired" data-i18n="diagnostics.options.modeWired"></option>
                  <option value="wifi" data-i18n="diagnostics.options.modeWifi"></option>
                </select>
              </label>
              <div class="action-wrap">
                <button class="btn primary" type="submit" data-i18n="diagnostics.save"></button>
              </div>
            </form>
          </article>
        </div>

        <div class="panel-grid dual">
          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="diagnostics.integrations.title"></h3>
                <p class="body-copy" data-i18n="diagnostics.integrations.body"></p>
              </div>
              <button class="btn secondary" id="integrations-refresh" type="button" data-i18n="diagnostics.integrations.refresh"></button>
            </div>
            <div class="data-list" id="integration-list"></div>
          </article>

          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="diagnostics.checkResults.title"></h3>
                <p class="body-copy" data-i18n="diagnostics.checkResults.body"></p>
              </div>
              <button class="btn ghost small" id="llm-check" type="button" data-i18n="diagnostics.checkResults.llmAction"></button>
            </div>
            <div class="data-list" id="diagnostic-checks"></div>
          </article>
        </div>

        <article class="section-card surface">
          <div class="section-head">
            <div>
              <h3 class="title-clamp" data-i18n="diagnostics.advanced.title"></h3>
              <p class="body-copy" data-i18n="diagnostics.advanced.body"></p>
            </div>
          </div>
          <div class="panel-grid dual">
            <div class="stack-gap">
              <label class="field">
                <span class="field-label" data-i18n="diagnostics.advanced.token"></span>
                <input id="auth-token" type="password" data-i18n-placeholder="diagnostics.advanced.tokenPlaceholder">
              </label>
              <div class="action-wrap">
                <button class="btn primary" id="save-token" type="button" data-i18n="diagnostics.advanced.saveToken"></button>
                <button class="btn ghost" id="clear-token" type="button" data-i18n="diagnostics.advanced.clearToken"></button>
                <button class="btn secondary" id="config-refresh" type="button" data-i18n="diagnostics.advanced.refreshConfig"></button>
              </div>
            </div>
            <pre id="config-json"></pre>
          </div>
        </article>
      </section>

      <section class="tab" id="tab-memory">
        <article class="section-card surface">
          <div class="section-head">
            <div>
              <p class="kicker" data-i18n="memory.kicker"></p>
              <h3 class="title-clamp" data-i18n="memory.title"></h3>
              <p class="body-copy" data-i18n="memory.body"></p>
            </div>
            <div class="action-wrap">
              <button class="btn secondary" id="reload-memory" type="button" data-i18n="memory.reload"></button>
              <button class="btn primary" id="save-memory" type="button" data-i18n="memory.save"></button>
            </div>
          </div>
          <div class="panel-grid dual memory-layout">
            <div class="section-card subtle">
              <div class="section-head compact">
                <div>
                  <h4 class="title-clamp" data-i18n="memory.filesTitle"></h4>
                  <p class="body-copy" data-i18n="memory.filesBody"></p>
                </div>
              </div>
              <div class="data-list" id="memory-list"></div>
            </div>
            <div class="section-card subtle">
              <div class="section-head compact">
                <div>
                  <h4 class="title-clamp" id="memory-title"></h4>
                  <p class="body-copy" id="memory-meta"></p>
                </div>
              </div>
              <textarea id="memory-editor" spellcheck="false"></textarea>
            </div>
          </div>
        </article>
      </section>

      <section class="tab" id="tab-conversation">
        <article class="section-card surface">
          <div class="section-head">
            <div>
              <p class="kicker" data-i18n="conversation.kicker"></p>
              <h3 class="title-clamp" data-i18n="conversation.title"></h3>
              <p class="body-copy" data-i18n="conversation.body"></p>
            </div>
            <div class="action-wrap">
              <button class="btn secondary" id="conversation-refresh" type="button" data-i18n="conversation.refresh"></button>
              <button class="btn danger" id="conversation-clear" type="button" data-i18n="conversation.clear"></button>
            </div>
          </div>
          <div class="form-grid dual">
            <label class="field">
              <span class="field-label" data-i18n="conversation.filters.speaker"></span>
              <select id="speaker-filter">
                <option value="" data-i18n="conversation.filters.allSpeakers"></option>
              </select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n="conversation.filters.limit"></span>
              <input id="conversation-limit" type="number" min="1" max="500" value="50">
            </label>
          </div>
          <div class="data-list" id="conversation-list"></div>
        </article>
      </section>

      <section class="tab" id="tab-schedules">
        <article class="section-card surface">
          <div class="section-head">
            <div>
              <p class="kicker" data-i18n="schedules.kicker"></p>
              <h3 class="title-clamp" data-i18n="schedules.title"></h3>
              <p class="body-copy" data-i18n="schedules.body"></p>
            </div>
            <button class="btn secondary" id="schedules-refresh" type="button" data-i18n="schedules.refresh"></button>
          </div>
          <form class="editor-grid schedule-form" id="schedule-form">
            <div class="form-grid dual">
              <label class="field">
                <span class="field-label" data-i18n="schedules.fields.title"></span>
                <input id="schedule-title" type="text" data-i18n-placeholder="schedules.fields.titlePlaceholder" required>
              </label>
              <label class="field">
                <span class="field-label" data-i18n="schedules.fields.datetime"></span>
                <input id="schedule-datetime" type="datetime-local" required>
              </label>
              <label class="field">
                <span class="field-label" data-i18n="schedules.fields.reminder"></span>
                <input id="schedule-reminder" type="number" min="0" step="5" value="10">
              </label>
              <label class="field">
                <span class="field-label" data-i18n="schedules.fields.description"></span>
                <input id="schedule-description" type="text" data-i18n-placeholder="schedules.fields.descriptionPlaceholder">
              </label>
            </div>
            <div class="action-wrap">
              <button class="btn primary" type="submit" data-i18n="schedules.add"></button>
            </div>
          </form>
          <div class="data-list" id="schedule-list"></div>
        </article>
      </section>

      <section class="tab" id="tab-chat">
        <div class="panel-grid dual chat-layout">
          <article class="section-card surface">
            <div class="section-head">
              <div>
                <p class="kicker" data-i18n="chat.kicker"></p>
                <h3 class="title-clamp" data-i18n="chat.title"></h3>
                <p class="body-copy" data-i18n="chat.body"></p>
              </div>
            </div>
            <div class="feed" id="chat-feed"></div>
          </article>
          <article class="section-card surface">
            <div class="section-head">
              <div>
                <h3 class="title-clamp" data-i18n="chat.composeTitle"></h3>
                <p class="body-copy" data-i18n="chat.composeBody"></p>
              </div>
            </div>
            <form class="editor-grid" id="chat-form">
              <label class="field">
                <span class="field-label" data-i18n="chat.speaker"></span>
                <input id="chat-speaker" type="text" value="web_user">
              </label>
              <label class="field">
                <span class="field-label" data-i18n="chat.message"></span>
                <textarea id="chat-input" data-i18n-placeholder="chat.messagePlaceholder"></textarea>
              </label>
              <div class="action-wrap">
                <button class="btn primary" type="submit" data-i18n="chat.send"></button>
                <button class="btn ghost" id="chat-clear" type="button" data-i18n="chat.clear"></button>
              </div>
            </form>
          </article>
        </div>
      </section>

      <section class="tab" id="tab-logs">
        <article class="section-card surface">
          <div class="section-head">
            <div>
              <p class="kicker" data-i18n="logs.kicker"></p>
              <h3 class="title-clamp" data-i18n="logs.title"></h3>
              <p class="body-copy" data-i18n="logs.body"></p>
            </div>
            <div class="action-wrap">
              <button class="btn secondary" id="logs-refresh" type="button" data-i18n="logs.refresh"></button>
              <button class="btn ghost" id="logs-pause" type="button"></button>
            </div>
          </div>
          <div class="form-grid dual">
            <label class="field">
              <span class="field-label" data-i18n="logs.tail"></span>
              <input id="log-tail" type="number" min="20" max="500" value="150">
            </label>
            <label class="field">
              <span class="field-label" data-i18n="logs.filter"></span>
              <input id="log-filter" type="text" data-i18n-placeholder="logs.filterPlaceholder">
            </label>
          </div>
          <pre id="logs-view"></pre>
        </article>
      </section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
